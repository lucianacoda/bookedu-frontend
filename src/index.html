<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Escolar MVP</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h1, h3 { 
            color: #ffffff; 
        }
        .card { 
            border: 1px solid #333; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            background-color: #1e1e1e; 
        }
        .controls { 
            margin-bottom: 20px; 
            padding: 15px; 
            background: #1e1e1e; 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
        button { 
            cursor: pointer; 
            padding: 6px 12px; 
            border: 1px solid #444; 
            border-radius: 4px; 
            background-color: #2c2c2c; 
            color: #e0e0e0; 
            transition: 0.2s; 
        }
        button:hover:not(:disabled) { 
            background-color: #444; 
        }
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        input, select { 
            margin-bottom: 5px; 
            padding: 6px; 
            display: block; 
            background-color: #2c2c2c; 
            border: 1px solid #444; 
            border-radius: 4px; 
            color: #e0e0e0; 
            box-sizing: border-box;
        }
        input {
            width: 200px;
        }
        input::placeholder { 
            color: #888; 
        }
    </style>
</head>
<body>
    <h1>Gestão de Acervo - Biblioteca</h1>
    
    <div class="controls">
        <h3>Cadastrar Livro</h3>
        <input type="text" id="inputIsbn" placeholder="ISBN (opcional)">
        <input type="text" id="inputTitle" placeholder="Título (opcional)">
        <input type="text" id="inputAuthor" placeholder="Autor (opcional)">
        <button onclick="addBook()">Adicionar Livro</button>
    </div>

    <div class="controls">
        <h3>Filtros do Acervo</h3>
        <select id="statusFilter" onchange="loadBooks()" style="width: 100%;">
            <option value="">Todos</option>
            <option value="Available">Disponíveis</option>
            <option value="Borrowed">Emprestados</option>
        </select>
    </div>

    <div id="booksList"></div>

    <script>
        const API_URL = "http://localhost:8000/books/";

        async function addBook() {
            const isbn = document.getElementById('inputIsbn').value;
            const title = document.getElementById('inputTitle').value;
            const author = document.getElementById('inputAuthor').value;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isbn: isbn, title: title, author: author })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Erro ao cadastrar livro.");
                }
                
                document.getElementById('inputIsbn').value = '';
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputAuthor').value = '';
                loadBooks();
            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        }

        async function loadBooks() {
            const statusFilter = document.getElementById('statusFilter').value;
            const url = statusFilter ? `${API_URL}?status=${statusFilter}` : API_URL;
            
            const response = await fetch(url);
            const books = await response.json();
            const container = document.getElementById('booksList');
            container.innerHTML = '';
            
            books.forEach(book => {
                const statusPt = book.status === 'Available' ? 'Disponível' : 'Emprestado';
                const isBorrowed = book.status === 'Borrowed';
                const isAvailable = book.status === 'Available';

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <strong>${book.title}</strong> <br>
                    <small style="color: #bbb;">Autor: ${book.author} | Status: ${statusPt}</small> <br><br>
                    <button onclick="updateStatus(${book.id}, 'Borrowed')" ${isBorrowed ? 'disabled' : ''}>Emprestar</button>
                    <button onclick="updateStatus(${book.id}, 'Available')" ${isAvailable ? 'disabled' : ''}>Devolver</button>
                    <button onclick="removeBook(${book.id})" style="color: #ff6b6b; border-color: #552222; background-color: #331111;">Remover</button>
                `;
                container.appendChild(div);
            });
        }

        async function updateStatus(id, newStatus) {
            await fetch(`${API_URL}${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            loadBooks();
        }

        async function removeBook(id) {
            if(confirm("Tem certeza que deseja remover este livro?")) {
                await fetch(`${API_URL}${id}`, { method: 'DELETE' });
                loadBooks();
            }
        }

        loadBooks();
    </script>
</body>
</html>
